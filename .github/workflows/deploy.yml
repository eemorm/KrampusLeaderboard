name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Run scoring tests
        run: npm test
      - name: Check JavaScript syntax
        run: for file in js/*.js; do node --check "$file"; done
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html submit.html admin.html _site/
          cp -R css js _site/
          mkdir -p _site/data
          cp data/teams.json _site/data/teams.json
          test -s _site/data/teams.json

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html submit.html admin.html _site/
          cp -R css js _site/
          mkdir -p _site/data
          cp data/teams.json _site/data/teams.json
          test -s _site/data/teams.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
