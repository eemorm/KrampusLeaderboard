<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10251c">
  <meta name="description" content="The 12 Days of Krampus leaderboard.">
  <title>12 Days of Krampus | Leaderboard</title>
  <link rel="stylesheet" href="css/styles.css?v=christmas-7">
  <link rel="stylesheet" href="css/leaderboard.css?v=christmas-7">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./">12 Days of Krampus</a>
    <nav><a class="nav-link" href="./">Leaderboard</a><a class="nav-link subtle-link" href="submit.html">Log in</a></nav>
  </header>
  <main class="page-shell home-layout">
    <section class="leaderboard-section" aria-labelledby="leaderboard-title">
      <div class="section-heading"><h1 id="leaderboard-title">Leaderboard</h1><div class="refresh-label"><span class="refresh-indicator"></span><span id="updated-at">Not connected</span></div></div>
      <div class="wreath-frame"><span class="wreath-sprig wreath-sprig-top-left" aria-hidden="true"></span><span class="wreath-sprig wreath-sprig-top-right" aria-hidden="true"></span><span class="wreath-sprig wreath-sprig-bottom-left" aria-hidden="true"></span><span class="wreath-sprig wreath-sprig-bottom-right" aria-hidden="true"></span><div id="leaderboard-content" aria-live="polite"><div class="state-card loading-card"><span class="spinner" aria-hidden="true"></span><span>Loading the leaderboard…</span></div></div></div>
      <p class="privacy-note">Team scores only. Individual scores are private.</p>
    </section>
  </main>
  <script type="module" src="js/leaderboard.js"></script>
</body>
</html>
